<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NETWORKERS PORTAL</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#090b10; --card:#11151d; --text:#f7f8fb; --muted:#8f98a8; 
  --green:#55d39b; --red:#ff6f7d; --line:rgba(255,255,255,.08); --accent:#4a90e2;
}
body{
  font-family:'Outfit',sans-serif; background-color:var(--bg); color:var(--text); 
  min-height:100vh; padding-bottom:30px;
}
.app{max-width:520px; margin:auto;}

/* Header */
.top{padding:20px 18px; text-align:center; border-bottom:1px solid var(--line); margin-bottom:15px;}
.top h1{font-size:24px; font-weight:800; letter-spacing:1px; text-transform:uppercase;}
.top p{font-size:10px; color:var(--muted); letter-spacing:2px; margin-top:4px;}

/* Section Styles */
.section{padding:0 16px 20px;}
.section-title{font-size:11px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; margin-bottom:10px;}
.card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px;}

/* User Stats & Buttons */
.balance-box{text-align:center; margin-bottom:15px;}
.balance-box span{font-size:12px; color:var(--muted);}
.balance-box h2{font-size:32px; font-weight:800; margin-top:5px;}
.btn-main{width:100%; padding:15px; border-radius:12px; background:var(--text); color:var(--bg); font:700 14px 'Outfit'; border:0; margin-top:10px;}
.btn-main:active{transform:scale(.98);}

/* User History Format */
.history-item{background:rgba(255,255,255,0.03); border:1px solid var(--line); border-radius:12px; padding:15px; margin-bottom:10px; font-size:13px;}
.hist-title{font-size:11px; color:var(--muted); margin-bottom:8px; text-transform:uppercase; letter-spacing:1px;}
.hist-name{font-weight:700; margin-bottom:5px;}
.hist-details{display:flex; justify-content:space-between; margin-bottom:8px;}
.hist-proof{font-size:12px; color:var(--accent); font-weight:600;}

/* Admin Panel Styles */
.admin-area{display:none; border-top:2px dashed var(--line); padding-top:20px; margin-top:10px;}
.admin-total{font-weight:800; font-size:16px; margin-bottom:15px; color:#fff; text-align:center; background:rgba(255,255,255,0.05); padding:10px; border-radius:10px;}
.req-item{border-bottom:1px solid var(--line); padding:12px 0;}
.req-item:last-child{border-bottom:0;}
.req-name{font-weight:700; font-size:14px; margin-bottom:5px;}
.req-action{display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--muted);}
.action-btns button{border:0; background:rgba(255,255,255,0.05); padding:6px 12px; border-radius:8px; font-size:14px; margin-left:5px;}

/* Settings */
.settings-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; background:rgba(255,255,255,0.03); padding:8px 12px; border-radius:10px;}
.settings-row span{font-size:12px; font-weight:600;}
.settings-row input{background:transparent; border:1px solid var(--line); color:#fff; padding:6px 10px; border-radius:6px; width:130px; font-size:12px; font-family:'Outfit'; outline:none;}
.settings-row button{background:transparent; border:0; font-size:16px;}

/* Modal for Withdrawal */
.modal{position:fixed; inset:0; background:rgba(0,0,0,.8); display:none; place-items:center; z-index:10; padding:20px;}
.modal-content{background:var(--card); width:100%; max-width:400px; padding:25px; border-radius:20px; border:1px solid var(--line);}
.modal-content input{width:100%; padding:14px; background:#0b0e13; border:1px solid var(--line); color:#fff; border-radius:10px; margin-bottom:15px; font-family:'Outfit'; outline:none;}
.modal-close{float:right; background:transparent; border:0; color:var(--muted); font-size:18px;}
.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#fff; color:#000; padding:10px 20px; border-radius:20px; font-size:12px; font-weight:700; display:none;}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <h1>NETWORKERS</h1>
    <p id="userInfo">PORTAL • VERIFIED</p>
  </header>

  <!-- USER SECTION -->
  <section class="section">
    <div class="card">
      <div class="balance-box">
        <span>Available Balance</span>
        <h2 id="balanceDisp">₹0</h2>
      </div>
      <button class="btn-main" onclick="openModal()">WITHDRAW VIA UPI</button>
    </div>
  </section>

  <!-- USER HISTORY -->
  <section class="section">
    <div class="section-title">Payment History</div>
    <div class="card" id="historyBox">
      <!-- Injected via JS -->
      <div style="text-align:center; color:#8f98a8; font-size:12px;">No payment history.</div>
    </div>
  </section>

  <!-- ADMIN SECTION -->
  <section class="section admin-area" id="adminPanel">
    
    <div class="section-title">Admin Control - Pending Requests</div>
    <div class="card" style="margin-bottom:20px;">
      <div id="adminRequestsBox"></div>
    </div>

    <div class="section-title">Settings - CONTACT // PROOF</div>
    <div class="card">
      <div class="settings-row">
        <span>CHANGE PROOF</span>
        <div>
          <input type="text" id="proofInput" value="@TOJIXWORKS">
          <button onclick="changeSetting('proof')">✅</button>
        </div>
      </div>
      <div class="settings-row">
        <span>CHANGE CONTACT</span>
        <div>
          <input type="text" id="contactInput" value="@TOJI_HERE_PERSONALBOT">
          <button onclick="changeSetting('contact')">✅</button>
        </div>
      </div>
    </div>

  </section>
</div>

<!-- WITHDRAWAL MODAL -->
<div class="modal" id="withdrawModal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h3 style="margin-bottom:15px; font-size:18px;">Withdraw Funds</h3>
    <input type="number" id="wAmount" placeholder="Amount (Min ₹20)">
    <input type="text" id="wUpi" placeholder="UPI ID (e.g. example@upi)">
    <button class="btn-main" onclick="submitWithdraw()">Submit Request</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const tg = window.Telegram?.WebApp;
  if(tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#090b10'); tg.setBackgroundColor('#090b10'); }
  
  const user = tg?.initDataUnsafe?.user || {};
  document.getElementById('userInfo').textContent = `${(user.first_name || 'Guest').toUpperCase()} • ID: ${user.id || '---'}`;

  // Parse URL Parameters (This is how the Bot sends data to the static Web App)
  const params = new URLSearchParams(location.search);
  const balance = Number(params.get('bal') || 0);
  document.getElementById('balanceDisp').textContent = `₹${balance}`;
  
  const adminIds = (params.get('admins') || '').split(',');
  const proofUsername = params.get('proof') || '@TOJIXWORKS';
  const contactUsername = params.get('contact') || '@TOJI_HERE_PERSONALBOT';

  document.getElementById('proofInput').value = proofUsername;
  document.getElementById('contactInput').value = contactUsername;

  // Render User History
  let history = [];
  try { history = JSON.parse(decodeURIComponent(params.get('history') || '[]')); } catch(e){}
  
  const histBox = document.getElementById('historyBox');
  if(history.length > 0) {
    histBox.innerHTML = history.map(h => {
      const isApproved = h.status.toLowerCase() === 'approved';
      return `
        <div class="history-item">
          <div class="hist-title">WITHDRAWAL REQUEST~</div>
          <div class="hist-name">${h.name} | ${h.userid}</div>
          <div class="hist-details">
            <span>${h.upi} ~ ₹${h.amount}</span>
            <span>~ &nbsp;&nbsp; ${isApproved ? 'APPROVED✅' : 'REJECTED❌'}</span>
          </div>
          <div class="hist-proof">${isApproved ? 'PROOF~ '+proofUsername : 'CONTACT~ '+contactUsername}</div>
        </div>
      `;
    }).join('');
  }

  // Render Admin Panel if User is Admin
  if(user.id && adminIds.includes(String(user.id))) {
    document.getElementById('adminPanel').style.display = 'block';
    
    let pendingReqs = [];
    try { pendingReqs = JSON.parse(decodeURIComponent(params.get('reqs') || '[]')); } catch(e){}
    
    const reqBox = document.getElementById('adminRequestsBox');
    const totalAmt = pendingReqs.reduce((sum, r) => sum + Number(r.amount), 0);
    
    let reqHtml = `<div class="admin-total">TOTAL ~ ${pendingReqs.length} | ₹${totalAmt}/-</div>`;
    
    if(pendingReqs.length === 0) {
      reqHtml += `<div style="text-align:center; font-size:12px; color:#8f98a8;">No pending requests.</div>`;
    } else {
      pendingReqs.forEach(r => {
        reqHtml += `
          <div class="req-item">
            <div class="req-name">${r.name} | ${r.userid}</div>
            <div class="req-action">
              <span>${r.upi} ~ ₹${r.amount}</span>
              <div class="action-btns">
                <span>~</span>
                <button onclick="adminAction('reject', '${r.id}')">❌</button>
                <span>|</span>
                <button onclick="adminAction('approve', '${r.id}')">✅</button>
              </div>
            </div>
          </div>
        `;
      });
      reqHtml += `<div style="margin-top:15px; font-size:12px; color:#8f98a8;">ETC...</div>`;
    }
    reqBox.innerHTML = reqHtml;
  }

  // App Functions
  function openModal() { document.getElementById('withdrawModal').style.display = 'grid'; }
  function closeModal() { document.getElementById('withdrawModal').style.display = 'none'; }
  
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2500);
  }

  function submitWithdraw() {
    const amt = document.getElementById('wAmount').value;
    const upi = document.getElementById('wUpi').value;
    if(amt < 20) return showToast('Minimum ₹20 required');
    if(!upi) return showToast('Enter UPI details');
    
    sendToBot({ action: 'withdraw', amount: amt, details: upi });
  }

  function adminAction(type, reqId) {
    sendToBot({ action: 'admin_update', type: type, request_id: reqId });
  }

  function changeSetting(target) {
    const val = document.getElementById(target + 'Input').value;
    sendToBot({ action: 'change_setting', target: target, value: val });
  }

  function sendToBot(data) {
    if(tg) {
      tg.sendData(JSON.stringify(data));
      showToast('Processing...');
      setTimeout(() => tg.close(), 500);
    } else {
      alert("Please use this inside Telegram.");
    }
  }
</script>
</body>
</html>
